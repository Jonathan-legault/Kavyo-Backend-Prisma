name: Backend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma validates configuration during generate; no DB is contacted.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/kavyo_ci?schema=public
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build NestJS
        run: npm run build
      - name: Run unit tests
        run: npm test
